
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'n_cmapss_mlops_rul_factory'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'n_cmapss_mlops_rul_factory'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

dbt-cloud:
  project-id: 70471823579544

on-run-start:
  - "SET memory_limit = '8GB';"
  - "SET preserve_insertion_order = false;"

# Global variables
vars:
  telemetry_lake_path: "../../.workspace/telemetry_lake/"

# Configuring models
models:
  n_cmapss_mlops_rul_factory:
    staging:
      +materialized: table
      +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

    reports:
      +materialized: table
      +schema: reports

seeds:
  n_cmapss_mlops_rul_factory:
    fuel_prices:
      +column_types:
        eia_spot_price_usd_per_gal: double
        hedged_price_usd_per_gal: double
