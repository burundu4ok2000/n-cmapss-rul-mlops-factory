# INDUSTRIAL SESSION CONTRACT (V1.0.0)
# This contract defines the mandatory attributes for any HPC Training session.

version: "0.0.1"
description: "Compliance schema for N-CMAPSS cloud training sessions."

schema:
  # 1. Identity & Lineage (The "Who" and "When")
  identity:
    run_id: 
      type: "string"
      pattern: "^bayesian-[0-9]{8}-[a-f0-9]{6}$"
      description: "Unique session identifier generated by the factory."
    timestamp_utc:
      type: "iso8601"
      description: "Exact start time in UTC."
    git_commit_hash:
      type: "string"
      length: 40
      description: "SHA-1 hash of the factory source code."

  # 2. Operational Flavor (The "How")
  execution:
    factory_mode:
      type: "enum"
      values: ["LOCAL", "DOCKER"]
      default: "DOCKER"
    compute_type:
      type: "enum"
      values: ["cpu_hpc"]
      description: "The hardware profile used for this training."

  # 3. Security & Sovereignty (The "Trust")
  security:
    oidc_identity:
      type: "string"
      description: "GCP Service Account identity of the worker."
    encryption_key_id:
      type: "string"
      optional: true
      description: "Cloud KMS key for artifact encryption."

  # 4. Infrastructure Anchors (The "Where")
  infrastructure:
    gcp_project_id:
      type: "string"
    data_lake_bucket:
      type: "string"
